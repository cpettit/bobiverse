name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace + plugin manifests
        run: |
          claude plugin validate .
          claude plugin validate plugins/bobiverse
          claude plugin validate plugins/bobnet-display
          claude plugin validate plugins/bobnet-shield
      - name: Frontmatter parses on every agent, command, and output style
        run: |
          pip install -q pyyaml
          python3 - <<'EOF'
          import yaml, glob, sys
          bad = 0
          for f in glob.glob('plugins/bobiverse/agents/*.md') + glob.glob('plugins/bobiverse/commands/*.md') + glob.glob('plugins/bobiverse/output-styles/*.md'):
              try:
                  fm = yaml.safe_load(open(f).read().split('---')[1])
                  assert fm.get('description'), 'missing description'
              except Exception as e:
                  print(f'FAIL {f}: {e}'); bad += 1
          print('frontmatter ok' if not bad else f'{bad} bad'); sys.exit(bad)
          EOF
      - name: Hook self-tests
        run: python3 plugins/bobiverse/hooks/scripts/selftest.py
      - name: Moot Hall mod tests
        run: claude plugin test plugins/bobnet-display
      - name: Shield mod tests
        run: claude plugin test plugins/bobnet-shield
      - name: Compliance posture report renders
        run: python3 plugins/bobiverse/hooks/scripts/compliance_check.py --project . > /dev/null
      - name: Status line renders
        run: |
          echo '{"model":{"display_name":"Claude"},"workspace":{"current_dir":"."},"context_window":{"used_percentage":12}}' \
            | BOBS_LOG_NOCOLOR=1 python3 plugins/bobiverse/statusline/bobs-log.py
